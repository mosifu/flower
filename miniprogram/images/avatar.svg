<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4e8"/>
      <stop offset="1" stop-color="#e9f5ec"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#528c66" stroke-width="12"/>

  <!-- 花瓣 -->
  <g id="petals">
    <g transform="translate(256 226)">
      <g transform="rotate(0)   translate(66 0)"><ellipse rx="26" ry="44" fill="#f08aad"/></g>
      <g transform="rotate(45)  translate(66 0)"><ellipse rx="26" ry="44" fill="#f7aac3"/></g>
      <g transform="rotate(90)  translate(66 0)"><ellipse rx="26" ry="44" fill="#f08aad"/></g>
      <g transform="rotate(135) translate(66 0)"><ellipse rx="26" ry="44" fill="#f7aac3"/></g>
      <g transform="rotate(180) translate(66 0)"><ellipse rx="26" ry="44" fill="#f08aad"/></g>
      <g transform="rotate(225) translate(66 0)"><ellipse rx="26" ry="44" fill="#f7aac3"/></g>
      <g transform="rotate(270) translate(66 0)"><ellipse rx="26" ry="44" fill="#f08aad"/></g>
      <g transform="rotate(315) translate(66 0)"><ellipse rx="26" ry="44" fill="#f7aac3"/></g>
    </g>
  </g>

  <!-- 花心 -->
  <circle cx="256" cy="226" r="40" fill="#f6c14a"/>

  <!-- 叶片 -->
  <g transform="translate(164 292) rotate(35)"><ellipse rx="34" ry="14" fill="#78b27a"/></g>
  <g transform="translate(348 292) rotate(-35)"><ellipse rx="34" ry="14" fill="#78b27a"/></g>

  <!-- 文字 -->
  <text x="256" y="410" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="46" font-weight="bold" fill="#3e7d5c">花知道</text>
</svg>
